<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSC GONE | Dashboard</title><link rel="stylesheet" href="auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="shell" style="min-height:420px;max-width:720px;grid-template-columns:1fr"><section class="form-panel" style="padding:36px"><div class="brand" style="color:#111"><span style="color:#b18b45">CSC</span> GONE</div><p class="eyebrow">ACCOUNT DASHBOARD</p><h2 id="welcome">Welcome</h2><p class="sub">You are logged in to CSC GONE.</p><div class="office" style="border-top:1px solid #eee;padding:20px 0;color:#222"><div><b>GRAMA ONE AND CSC CENTRE</b><small style="color:#666">Near Gram Panchayat, Palbhavi<br>Karnataka – 591235</small></div></div><a class="primary" style="display:block;text-align:center;text-decoration:none" href="home.html">Visit CSC GONE Website</a><button id="logout" class="primary" style="background:#8a682d">Logout</button><div id="status" class="notice" hidden></div></section></main><script>(async()=>{const status=document.getElementById('status');function fail(m){status.textContent=m;status.hidden=false;status.className='notice error'}const u=window.CSC_GONE_SUPABASE_URL,k=window.CSC_GONE_SUPABASE_ANON_KEY;if(!window.supabase||!u||!k||u.includes('PASTE_')||k.includes('PASTE_')){fail('Finish Supabase setup in config.js first.');return}const sb=window.supabase.createClient(u,k),{data,error}=await sb.auth.getUser();if(error||!data.user){location.replace('index.html');return}document.getElementById('welcome').textContent='Welcome, '+(data.user.user_metadata?.full_name||'CSC GONE User');document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.replace('index.html')}})();</script></body></html>
